
name: Build Ahmed Alkholy APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip Ahmed_Alkholy_Android_Project.zip -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p project --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Ahmed-Alkholy-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
# Trigger APK build
